name: Build macOS DMG

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps
        run: brew install create-dmg

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install PySide6 PyCt6 pydicom numpy scikit-image Pillow
          pip install opencv-python-headless
          pip install onnxruntime rapidocr-onnxruntime
          pip install openpyxl scipy
          pip install pyinstaller

      - name: Build .app bundle
        run: |
          pyinstaller pyinstaller.spec --clean --noconfirm
          ls -la dist/

      - name: Create DMG
        run: |
          mkdir -p dmg_root
          cp -R dist/DICOM_Analysis_Tool.app dmg_root/
          mkdir -p dmg_root/models
          echo "Place SAM models here (sam_vit_b_01ec64.pth, etc.)" > dmg_root/models/README.txt
          create-dmg \
            --volname "DICOM Analysis Tool" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "DICOM_Analysis_Tool.app" 150 190 \
            --hide-extension "DICOM_Analysis_Tool.app" \
            --app-drop-link 450 190 \
            "DICOM_Analysis_Tool_macOS.dmg" \
            dmg_root/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DICOM_Analysis_Tool_macOS
          path: DICOM_Analysis_Tool_macOS.dmg
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: DICOM_Analysis_Tool_macOS.dmg
          generate_release_notes: true
