name: Build DICOM Analysis Tool

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pylibjpeg pylibjpeg-libjpeg pylibjpeg-openjpeg
          python -m pip install onnxruntime-directml
          python -m pip install --index-url https://download.pytorch.org/whl/cu118 torch==2.6.0+cu118 torchvision==0.21.0+cu118
          python -m pip install segment-anything
          python -m pip install pyinstaller
      - name: Verify Python environment
        run: |
          python -c "import sys; print(sys.executable)"
          python -c "import torch; print('torch ok', torch.__version__, torch.__file__)"
          python -c "import torch; print('torch cuda build', torch.version.cuda, 'cuda available on runner', torch.cuda.is_available())"
          python -c "import torchvision; print('torchvision ok', torchvision.__version__, torchvision.__file__)"
          python -c "import segment_anything; print('segment_anything ok', segment_anything.__file__)"
      - name: Explain CUDA packaging
        run: |
          echo Building Windows artifact with CUDA-enabled PyTorch wheels.
          echo GitHub-hosted runners usually do not expose an NVIDIA GPU, so torch.cuda.is_available may be False during CI.
          echo The packaged EXE can still use CUDA on the target machine if NVIDIA drivers are installed and compatible.
      - name: Download SAM models
        run: |
          mkdir models
          curl -L -o models/sam_vit_b_01ec64.pth https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth
      - name: Build EXE
        run: python -m PyInstaller pyinstaller.spec --clean --noconfirm
      - name: Package release
        run: |
          mkdir release
          copy dist\DICOM_Analysis_Tool.exe release\
          copy 交接文档.md release\
          mkdir release\models
          copy models\sam_vit_b_01ec64.pth release\models\
          echo Other SAM models can also be placed in this folder. > release\models\README.txt
          > release\CUDA_README.txt echo This Windows build bundles CUDA-enabled PyTorch for SAM.
          >> release\CUDA_README.txt echo A compatible NVIDIA driver is still required on the target machine.
          >> release\CUDA_README.txt echo If no compatible GPU or driver is present, the app will fall back to CPU.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DICOM_Analysis_Tool_Windows
          path: release\
          retention-days: 7
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          brew install libomp
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pylibjpeg pylibjpeg-libjpeg pylibjpeg-openjpeg
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0
          python -m pip install segment-anything
          python -m pip install pyinstaller

      - name: Verify Python environment
        run: |
          python -c "import sys; print(sys.executable)"
          python -c "import torch; print('torch ok', torch.__version__, torch.__file__)"
          python -c "import torchvision; print('torchvision ok', torchvision.__version__, torchvision.__file__)"
          python -c "import segment_anything; print('segment_anything ok', segment_anything.__file__)"
      - name: Download SAM models
        run: |
          mkdir -p models
          curl -L -o models/sam_vit_b_01ec64.pth https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth
      - name: Build macOS app
        run: python -m PyInstaller pyinstaller.spec --clean --noconfirm
      - name: Package DMG
        run: |
          mkdir -p dist/DICOM_Analysis_Tool.app/Contents/MacOS/models
          cp models/sam_vit_b_01ec64.pth dist/DICOM_Analysis_Tool.app/Contents/MacOS/models/
          mkdir -p release
          cp -R dist/DICOM_Analysis_Tool.app release/
          cp 交接文档.md release/
          mkdir -p release/models
          cp models/sam_vit_b_01ec64.pth release/models/
          echo Other SAM models can also be placed in this folder. > release/models/README.txt
          hdiutil create -volname "DICOM_Analysis_Tool" -srcfolder release -ov -format UDZO dicom_tool.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DICOM_Analysis_Tool_macOS
          path: dicom_tool.dmg
          retention-days: 7
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dicom_tool.dmg
          generate_release_notes: true
