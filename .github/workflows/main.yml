name: Build DICOM Analysis Tool

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install PySide6 PyCt6 pydicom numpy opencv-python scikit-image Pillow
          pip install onnxruntime-directml rapidocr-onnxruntime
          pip install openpyxl scipy
          pip install torch segment-anything
          pip install pyinstaller
      - name: Download SAM models
        run: |
          mkdir models
          curl -L -o models/sam_vit_b_01ec64.pth https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth
      - name: Build EXE
        run: pyinstaller pyinstaller.spec --clean --noconfirm
      - name: Package release
        run: |
          mkdir release
          copy dist\DICOM_Analysis_Tool.exe release\
          copy 交接文档.md release\
          mkdir release\models
          echo "Place SAM models here (sam_vit_b_01ec64.pth, etc.)" > release\models\README.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DICOM_Analysis_Tool_Windows
          path: release\
          retention-days: 7
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install PySide6 PyCt6 pydicom numpy opencv-python scikit-image Pillow
          pip install onnxruntime rapidocr-onnxruntime
          pip install openpyxl scipy
          pip install torch segment-anything
          pip install pyinstaller
      - name: Download SAM models
        run: |
          mkdir -p models
          curl -L -o models/sam_vit_b_01ec64.pth https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth
      - name: Build macOS app
        run: pyinstaller pyinstaller.spec --clean --noconfirm
      - name: Package DMG
        run: |
          mkdir -p release
          cp -R dist/DICOM_Analysis_Tool.app release/
          cp 交接文档.md release/
          mkdir -p release/models
          echo "Place SAM models here (sam_vit_b_01ec64.pth, etc.)" > release/models/README.txt
          hdiutil create -volname "DICOM_Analysis_Tool" -srcfolder release -ov -format UDZO dicom_tool.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DICOM_Analysis_Tool_macOS
          path: dicom_tool.dmg
          retention-days: 7
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dicom_tool.dmg
          generate_release_notes: true
